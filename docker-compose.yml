      - mysql
      - django
    env_file:
      - ./app/cEnergo.env
    volumes:
      - ./django_app:/app
      - ./logs:/app/logs
      - ./app/cEnergo.env:/app/cEnergo.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=infoenergo
      - MYSQL_USER=infoenergo
      - MYSQL_PASSWORD=infopass
    command: python manage.py sync_sanxing

  sync-sanrise:
