  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: meters_scheduler
    restart: always
    depends_on:
      - mysql
      - django
    env_file:
      - ./app/cEnergo.env
    volumes:
      - ./django_app:/app
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./app/cEnergo.env:/app/cEnergo.env
      - ./1c_reports:/app/1c_reports
      - ./django_app/exports:/app/exports
    environment:
      - TZ=Asia/Bishkek
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=infoenergo
      - MYSQL_USER=infoenergo
      - MYSQL_PASSWORD=infopass
    deploy:
      resources:
        limits:
          memory: 1G
    command: python manage.py run_scheduler
volumes:
  mysql_data:
