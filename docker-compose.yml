services:
  mysql:
    image: mysql:8.0
    container_name: meters_mysql
    restart: always
    environment:
      TZ: Asia/Bishkek
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: infoenergo
      MYSQL_USER: infoenergo
      MYSQL_PASSWORD: infopass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 4G
    command: --innodb-buffer-pool-size=5G --innodb-buffer-pool-instances=3 --max-connections=200
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: meters_django
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./app/cEnergo.env
    volumes:
      - ./django_app:/app
      - ./logs:/app/logs
      - ./Catalog.xlsx:/app/Catalog.xlsx
      - ./app/cEnergo.env:/app/cEnergo.env
      - ./1c_reports:/app/1c_reports
      - /var/run/docker.sock:/var/run/docker.sock
      - ./django_app/exports:/app/exports
    environment:
      - TZ=Asia/Bishkek
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=infoenergo
      - MYSQL_USER=infoenergo
      - MYSQL_PASSWORD=infopass
    deploy:
      resources:
        limits:
          memory: 1G
    command: sh -c "python wait_for_mysql.py && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --worker-class gthread --timeout 120"
