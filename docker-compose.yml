services:
  mysql:
    image: mysql:8.0
    container_name: meters_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: infoenergo
      MYSQL_USER: infoenergo
      MYSQL_PASSWORD: infopass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: meters_django
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./app/cEnergo.env
    volumes:
      - ./django_app:/app
      - ./logs:/app/logs
      - ./Catalog.xlsx:/app/Catalog.xlsx
      - ./app/cEnergo.env:/app/cEnergo.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=infoenergo
      - MYSQL_USER=infoenergo
      - MYSQL_PASSWORD=infopass
    command: python manage.py runserver 0.0.0.0:8000

  # Службы синхронизации
  sync-mssql:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: meters_sync_mssql
    restart: always
    depends_on:
      - mysql
      - django
    env_file:
      - ./app/cEnergo.env
    volumes:
      - ./django_app:/app
      - ./logs:/app/logs
      - ./app/cEnergo.env:/app/cEnergo.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=infoenergo
      - MYSQL_USER=infoenergo
      - MYSQL_PASSWORD=infopass
    command: python manage.py sync_mssql

  sync-sanxing:
