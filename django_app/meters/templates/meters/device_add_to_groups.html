{% extends 'meters/base.html' %}
{% block content %}
<h1 class="page-title"><i class="fas fa-plus-circle text-success"></i> Добавить устройство в группы</h1>
<div class="card-pastel">
    <div class="card-body">
        <p><strong>Устройство:</strong> {{ device.serial_number }} ({{ device.model.model_name|default:"—" }})</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Выберите группы (можно несколько, удерживайте Ctrl)</label>
                <select name="group_ids" multiple class="form-select form-control-pastel" size="10"
                    style="height: 200px;">
                    {% for g in groups %}
                    <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success"><i class="fas fa-plus-circle"></i> Добавить</button>
            <a href="{% url 'devices' %}" class="btn btn-pastel-outline"><i class="fas fa-times"></i> Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
