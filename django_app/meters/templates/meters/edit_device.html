{% extends 'meters/base.html' %}
{% block content %}
<h1 class="page-title"><i class="fas fa-pen"></i>Изменение заводского номера</h1>

<div class="card-pastel">
    <div class="card-header"><i class="fas fa-info-circle"></i> Текущий прибор</div>
    <div class="card-body">
        <p><strong>Текущий номер:</strong> {{ device.serial_number }}</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Новый заводской номер</label>
                <input type="text" name="serial_number" class="form-control form-control-pastel"
                    value="{{ device.serial_number }}" required>
                <div class="form-text">Введите новый номер. Он не должен совпадать с существующим.</div>
            </div>
            <!-- <div class="mb-3">
                <label class="form-label">Коэффициент ТТ</label>
                <input type="number" step="0.01" name="tt_ratio" class="form-control form-control-pastel"
                    value="{{ device.tt_ratio|default:'' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Коэффициент ТН</label>
                <input type="number" step="0.01" name="tn_ratio" class="form-control form-control-pastel"
                    value="{{ device.tn_ratio|default:'' }}">
            </div> -->
            <button type="submit" class="btn btn-pastel-primary"><i class="fas fa-save"></i> Сохранить</button>
            <a href="{% url 'devices' %}" class="btn btn-pastel-outline"><i class="fas fa-times"></i> Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
