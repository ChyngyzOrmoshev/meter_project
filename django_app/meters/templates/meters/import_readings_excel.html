{% extends 'meters/base.html' %}
{% block content %}
<h1 class="page-title"><i class="fas fa-file-import"></i> Импорт показаний из Excel</h1>

<div class="card-pastel">
    <div class="card-header"><i class="fas fa-upload"></i> Загрузите файл</div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Excel-файл (.xlsx, .xls)</label>
                <input type="file" name="excel_file" class="form-control form-control-pastel" accept=".xlsx,.xls"
                    required>
            </div>
            <button type="submit" class="btn btn-pastel-primary"><i class="fas fa-upload"></i> Загрузить и
                проанализировать</button>
            <a href="{% url 'devices' %}" class="btn btn-pastel-outline">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
