{% extends 'meters/base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-4 col-md-6 col-sm-10">
        <div class="card-pastel">
            <div class="card-header"><i class="fas fa-lock me-2"></i>Авторизация</div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин</label>
                        <input type="text" class="form-control form-control-pastel" id="username" name="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control form-control-pastel" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-pastel-primary w-100">Войти</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
