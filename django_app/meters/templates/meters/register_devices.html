{% extends 'meters/base.html' %}
{% block content %}
<h1 class="page-title"><i class="fas fa-user-plus"></i> Регистрация новых счётчиков</h1>
<div class="card-pastel">
    <div class="card-body">
        <form id="register-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="robot-select" class="form-label">Выберите источник</label>
                <select id="robot-select" class="form-select form-control-pastel">
                    <option value="">--</option>
                    {% for robot in robots %}
                    <option value="{{ robot }}">{{ robot }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="limit-input" class="form-label">Лимит (необязательно)</label>
                <input type="number" id="limit-input" class="form-control form-control-pastel" placeholder="Оставьте пустым для всех">
            </div>
            <button type="submit" class="btn btn-pastel-primary" id="register-btn">Зарегистрировать</button>
        </form>
        <div id="result-message" class="mt-3"></div>
    </div>
</div>
<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const robot = document.getElementById('robot-select').value;
    const limit = document.getElementById('limit-input').value;
    if (!robot) {
        alert('Выберите источник');
        return;
    }
    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.innerHTML = 'Загрузка...';
    fetch('{% url "register_devices" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
            'robot_name': robot,
            'limit': limit || ''
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            document.getElementById('result-message').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
        } else {
            document.getElementById('result-message').innerHTML = `<div class="alert alert-success">${data.message}</div>`;
        }
    })
    .catch(err => {
        document.getElementById('result-message').innerHTML = `<div class="alert alert-danger">Ошибка: ${err.message}</div>`;
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = 'Зарегистрировать';
    });
});
</script>
{% endblock %}
