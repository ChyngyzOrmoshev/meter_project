{% extends 'meters/base.html' %}
{% block content %}
<h1 class="page-title"><i class="fas fa-plus-circle"></i>Добавление Тип ПУ</h1>

<div class="card-pastel">
    <div class="card-header"><i class="fas fa-cube"></i> Новая Тип ПУ</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Код</label>
                    <input type="text" name="catalog_code" class="form-control form-control-pastel" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Наименование</label>
                    <input type="text" name="model_name" class="form-control form-control-pastel" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Значность</label>
                    <input type="text" name="digit_capacity" class="form-control form-control-pastel">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Фазность</label>
                    <input type="number" name="phases" class="form-control form-control-pastel" value="3">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Номинальный ток</label>
                    <input type="text" name="nominal_current" class="form-control form-control-pastel">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Номинальное напряжение</label>
                    <input type="text" name="nominal_voltage" class="form-control form-control-pastel">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Тип прибора</label>
                    <input type="text" name="system_type" class="form-control form-control-pastel">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Период</label>
                    <input type="text" name="period" class="form-control form-control-pastel">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Тип АСКУЭ</label>
                    <input type="text" name="device_type_id" class="form-control form-control-pastel">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Идентификатор API</label>
                    <input type="text" name="device_type_str" class="form-control form-control-pastel">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-pastel-primary"><i class="fas fa-save"></i> Добавить</button>
                <a href="{% url 'models' %}" class="btn btn-pastel-outline"><i class="fas fa-times"></i> Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
